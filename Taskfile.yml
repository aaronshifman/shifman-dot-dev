# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  GREETING: Hello, world!

tasks:
  default:
    cmd: task --list-all
    silent: true
  update:
    desc: update blowfish theme
    cmd: hugo mod get -u
  new-post:
    requires:
      vars:
        - NAME
    cmd: hugo new content posts/{{ .NAME }}.md
  serve:
    desc: run hugo server with drafts enabled
    cmd: hugo server --buildDrafts
