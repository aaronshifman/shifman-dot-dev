apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: site-ingress
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`shifman.dev`)
      kind: Rule
      services:
        - kind: Service
          name: shifman-dot-dev
          port: 8080
