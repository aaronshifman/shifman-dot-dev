apiVersion: v1
kind: Service
metadata:
  name: {{.Release.Name}}
spec:
  ports:
    - name: http
      port: {{.Values.service.port}}
      protocol: TCP
      targetPort: http
  selector:
    {{- $ctx := deepCopy . -}}
    {{- $_ := set $ctx.Values "component" "nginx" -}}
    {{- include "selectorLabels" $ctx | nindent 6 }}
  type: ClusterIP
